<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iintoo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>


     <div class="container">
        <div class="image">
        <img src="./bg.jpg" alt="iintoo invest together">
        <img class="logo" src="./logo.svg" alt="iintoo logo">
        </div>


    <header>
        <div class="content">
        <h2>Get iintoo it today</h2>
        <p class="subtitle">There is no charge or obligation upon registration.</p>
     </header>


     <main>
        <div class="buttons">

        <button class="facebook">
            <img src="./facebook.svg" alt="facebook logo">
            Register with Facebook
        </button>


        <button class="linkedin">
            <img src="./linkedin.svg" alt="linked in logo">
            Register with LinkedIn
        </button>
        </div>

        <p class="or">OR</p>

        <div class="forms">
        <form>
            <fieldset class="fieldset email">
            
            <label class="Email label" for="email">Email</label>
            <input type="email" name="email" id="email">
            </fieldset>
            
             <fieldset>
             
             <label class="Phone label" for="phone">Phone</label>
             <input type="tel" name="phone" id="phone">
             </fieldset>
            </div>

        <p class="type">What type of investor are you?</p>

        <p class="select">Select the type of investor you are below.</p>

        <div class="radio">
        <input type="radio" id="individual" name="investor_type" value="Individual">
        <label for="individual">Individual</label>
        <button>ⓘ</button>

        <input type="radio" id="business" name="investor_type" value="Business">
        <label for="business">Business</label>
        <button>ⓘ</button>

        <input type="radio" name="investor_type" id="ira" value="IRA">
        <label for="ira">IRA</label>
        <button>ⓘ</button>
        
        <input type="radio" name="investor_type" id="trust" value="Trust">
        <label for="trust">Trust</label>
        <button>ⓘ</button>
        </div>

        
        <p class="hint1">I am a natural person investing on my <br> own behalf as a sole owner, joint tenant, <br> or tenant in common.</p>
        <br><br>
            <input type="checkbox" name="agreement" id="agreement">
        <label class="agree" for="agreement">I agree to the terms and receiving notifications from iintoo</label>
        <a href="https://www.habsida.com">View full terms</a>
        <br><br>
        <button class="account">Create Account</button>
        </form>
    </div>
    </div>
    </main>
</body>
</html>
